services:
  db-postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-postgres-data:/var/lib/postgresql

volumes:
  db-postgres-data: