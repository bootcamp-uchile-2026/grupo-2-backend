services:
  db-postgres:
    image: postgres:18.6
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-postgres-data:/var/lib/postgresql

  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db-postgres
      DB_PORT: 5432
      BASE_ARCHIVOS: /app/ARCHIVOS
    volumes:
      - ./ARCHIVOS:/app/ARCHIVOS
    depends_on:
      - db-postgres

volumes:
  db-postgres-data: